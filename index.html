<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Josué Lustosa | Desenvolvedor de Software</title>

    <meta
      name="description"
      content="Página de Links de Josué Lustosa — Desenvolvedor de Software. Acesse meu portfólio, currículo e redes profissionais em um só lugar."
    />
    <meta name="author" content="Josué Lustosa" />
    <link rel="canonical" href="https://josuelustosa.github.io/links/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Josué Lustosa | Desenvolvedor de Software" />
    <meta
      property="og:description"
      content="Acesse meu portfólio, currículo e redes profissionais em um só lugar."
    />
    <meta property="og:url" content="https://josuelustosa.github.io/links/" />
    <meta
      property="og:image"
      content="https://josuelustosa.github.io/links/assets/img/preview-open-graph.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Josué Lustosa" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Josué Lustosa | Desenvolvedor de Software" />
    <meta
      name="twitter:description"
      content="Portfólio, currículo e redes profissionais"
    />
    <meta
      name="twitter:image"
      content="https://josuelustosa.github.io/links/assets/img/preview-open-graph.jpg"
    />

    <link
      rel="shortcut icon"
      href="https://avatars.githubusercontent.com/u/93569079?v=4"
      type="image/x-icon"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link
      rel="preload"
      as="image"
      href="./assets/img/perfil-josue-lustosa.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="./src/styles/index.css" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Josué Lustosa",
        "url": "https://josuelustosa.github.io/links/",
        "image": "https://josuelustosa.github.io/links/assets/img/preview-open-graph.jpg",
        "jobTitle": "Desenvolvedor de Software"
      }
    </script>
  </head>

  <body>
    <main class="page" aria-labelledby="profile-name">
      <header class="profile">
        <div class="profile-media">
          <div class="avatar-frame">
            <img
              class="avatar"
              src="assets/img/perfil-josue-lustosa.webp"
              alt="Foto de perfil de Josué Lustosa"
              width="138"
              height="138"
              decoding="async"
              fetchpriority="high"
              data-profile-avatar
            />
          </div>

          <div class="profile-actions">
            <div class="share-control">
              <button
                class="profile-action"
                type="button"
                data-share-button
                aria-label="Copiar link da página"
                aria-describedby="share-feedback"
                aria-expanded="false"
              >
                <img
                  src="assets/icons/phosphor/regular/share-network.svg"
                  alt=""
                  width="20"
                  height="20"
                  aria-hidden="true"
                />
              </button>

              <div
                id="share-feedback"
                class="share-feedback"
                role="status"
                aria-live="polite"
                data-share-feedback
                hidden
              >
                <strong data-share-message></strong>
                <span data-share-url></span>
              </div>
            </div>

            <button
              class="profile-action"
              type="button"
              data-theme-toggle
              aria-label="Ativar tema claro"
              aria-pressed="false"
            >
              <img
                src="assets/icons/phosphor/regular/sun.svg"
                alt=""
                width="20"
                height="20"
                data-theme-icon
                aria-hidden="true"
              />
            </button>
          </div>
        </div>

        <div class="profile-info">
          <h1 id="profile-name" data-profile-name>Josué Lustosa</h1>
          <p class="profile-role" data-profile-role>Desenvolvedor de Software</p>
          <p class="profile-location">
            <img
              src="assets/icons/phosphor/regular/map-pin.svg"
              alt=""
              width="16"
              height="16"
              aria-hidden="true"
            />
            <span data-profile-location>Manaus, Brasil</span>
          </p>
        </div>
      </header>

      <div class="tabs" role="tablist" aria-label="Conteúdo do perfil">
        <button
          class="tab"
          id="tab-links"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="panel-links"
        >
          Links
        </button>
        <button
          class="tab"
          id="tab-about"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="panel-about"
          tabindex="-1"
        >
          Sobre
        </button>
      </div>

      <section
        id="panel-links"
        class="tab-panel links-section"
        role="tabpanel"
        aria-labelledby="tab-links"
      >
        <h2 class="visually-hidden">Links</h2>
        <ul class="link-list" data-link-list></ul>
      </section>

      <section
        id="panel-about"
        class="tab-panel about-content"
        role="tabpanel"
        aria-labelledby="tab-about"
        hidden
      >
        <section class="about-intro" aria-labelledby="about-heading">
          <h2 id="about-heading" class="eyebrow">
            <span aria-hidden="true"></span>Um pouco sobre mim
          </h2>
          <p class="about-bio" data-profile-bio></p>
        </section>

        <section class="technology-section" aria-labelledby="technology-heading">
          <h2 id="technology-heading" class="eyebrow">
            <span aria-hidden="true"></span>Ferramentas &amp; tecnologias
          </h2>
          <ul class="technology-list" data-technology-list></ul>
        </section>
      </section>

      <div class="footer-divider" aria-hidden="true"></div>

      <footer class="footer-brand">
        <img
          class="footer-logo"
          src="assets/img/logo-josue-lustosa.png"
          alt="Josué Lustosa"
          width="145"
          height="49"
        />
      </footer>

      <p class="visually-hidden" role="status" aria-live="polite" data-app-status></p>
    </main>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
